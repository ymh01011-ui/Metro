name: Build APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Diagnostics - Find SDK paths and merged resources
        run: |
          echo "===== 1. مسارات الـ SDK المتاحة ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          find $ANDROID_HOME/platforms -maxdepth 1 2>/dev/null
          echo ""
          echo "===== 2. تشغيل الـ build مع لوج مفصل لخطوة الـ resources بس ====="
          ./gradlew :app:processDebugResources --stacktrace --info > /tmp/full_log.txt 2>&1 || true
          echo "===== نهاية الأسطر اللي فيها header_gradient_bg أو bg_default_header_gradient ====="
          grep -n -i "gradient" /tmp/full_log.txt | head -100
          echo ""
          echo "===== 3. عرض محتوى فولدر الـ merged resources لو موجود ====="
          find app/build/intermediates -type d -iname "*merged*res*" 2>/dev/null | head -5
          MERGED_DIR=$(find app/build/intermediates -type d -iname "*merged*res*" 2>/dev/null | head -1)
          if [ -n "$MERGED_DIR" ]; then
            find "$MERGED_DIR" -iname "*gradient*"
          fi
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias metro-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 01011412881 \
            -keypass 01011412881 \
            -dname "CN=Metro, OU=App, O=App, L=Cairo, S=Cairo, C=EG"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Align APK
        run: |
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -r | head -1)
          $ZIPALIGN -v -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -1)
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-pass pass:01011412881 \
            --key-pass pass:01011412881 \
            --ks-key-alias metro-release \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metro
          path: app/build/outputs/apk/release/app-release-signed.apk
